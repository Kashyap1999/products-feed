[[extensions]]
name = "Generate Product Feed"
handle = "generate-product-feed"
type = "flow_action"
uid = "75e6631e-c235-fbd4-36a0-e4ee85376f6ade5c6c8c"
description = "Generate and upload product feed to Shopify Files"
runtime_url = "https://products-feed.onrender.com/app/flow/generate-feed"

[extensions.settings.input]
type = "object"
properties = {}

[extensions.settings.output]
type = "object"
properties = {
  "productCount": {
    "type": "integer",
    "description": "Number of products in the feed"
  },
  "fileUrl": {
    "type": "string",
    "description": "URL of the uploaded feed file"
  }
}
